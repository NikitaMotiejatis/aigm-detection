# MLflow tracking server and model registry, machine A only (PLAN.md WP3 step 3).
# Runs and artifacts live in mlflow-data/; B reaches the server over Tailscale as http://aigm-a:5000.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0  # keep equal to the mlflow version in uv.lock
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
      --allowed-hosts localhost*,127.0.0.1*,aigm-a,aigm-a:*,aigm-a.*,100.*
