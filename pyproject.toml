[project]
name = "aigm"
version = "0.1.0"
description = "Detecting AI-generated music with neural networks: experiments and pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchaudio",
    "torchvision",
    "soundfile",
    "soxr",
    "numpy",
    "pandas",
    "scikit-learn",
    "omegaconf",
    "mlflow",
    "captum",
    "pedalboard",
    "imageio-ffmpeg",
    "matplotlib",
    "scipy>=1.18.1",
]

[project.scripts]
aigm = "aigm.cli:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigm"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
